<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Data Diri</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<style>
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 6%;
    background: #0f172a;
    color: #ffffff;
  }
  .brand { color: #60a5fa; text-decoration: none; font-size: 1.3rem; font-weight: bold; }
  .nav-links { list-style: none; display: flex; gap: 24px; }
  .nav-links a { color: #e2e8f0; text-decoration: none; transition: color .2s; }
  .nav-links a:hover { color: #60a5fa; }
  .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; }
  .hamburger span { width: 26px; height: 3px; background: #ffffff; border-radius: 2px; }

  @media (max-width: 768px) {
    .hamburger { display: flex; }
    .nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      flex-direction: column;
      gap: 0;
      background: #0f172a;
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .nav-links.open { max-height: 300px; }
    .nav-links li { padding: 14px 6%; border-top: 1px solid rgba(255,255,255,.15); }
  }
</style>

<nav class="navbar">
  <a href="#home" class="brand">💻 RPL MASTER</a>
  <button class="hamburger" id="hamburger" aria-label="Buka menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="#home">Home</a></li>
    <li><a href="#tentang">Tentang RPL</a></li>
    <li><a href="#kompetensi">Kompetensi</a></li>
    <li><a href="#keahlian">Keahlian</a></li>
    <li><a href="#kontak">Kontak</a></li>
  </ul>
</nav>

<script>
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a =>
    a.addEventListener('click', () => navLinks.classList.remove('open')));
  </script>

  
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  
</body>
</htm
